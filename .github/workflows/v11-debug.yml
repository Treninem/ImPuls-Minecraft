name: ImPuls v1.1 debug
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Show failing source context
        run: |
          echo '--- Database 548-565 ---'
          nl -ba plugin/src/main/java/ru/impuls/core/Database.java | sed -n '548,565p'
          echo '--- Dungeon 206-218 ---'
          nl -ba plugin/src/main/java/ru/impuls/core/DungeonService.java | sed -n '206,218p'
          echo '--- War 84-92 ---'
          nl -ba plugin/src/main/java/ru/impuls/core/WarService.java | sed -n '84,92p'
      - name: Compile
        run: mvn -B -f plugin/pom.xml clean package
