name: ImPuls build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Repair recovered v0.9.0 archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          p=Path('archives/ImPulsCore_Datapack_v0.9.0.zip')
          expected='1329b8c2181b688eda67a688b7a0a96714769173ac682633363645eeb78f27ae'
          raw=p.read_bytes()
          if hashlib.sha256(raw).hexdigest()!=expected:
              suffix=base64.b64decode(Path('archives/ImPulsCore_Datapack_v0.9.0.suffix.b64').read_text().strip())
              raw += suffix
              p.write_bytes(raw)
          assert hashlib.sha256(p.read_bytes()).hexdigest()==expected, 'v0.9.0 checksum mismatch'
          PY
      - name: Build datapack from recovered v0.9.0
        run: python3 tools/build_datapack.py
      - name: Validate release datapack
        run: python3 tools/validate_release.py
      - name: Build ImPulsCore plugin
        run: mvn -B -f plugin/pom.xml clean package
      - name: Verify JAR
        run: test -s plugin/target/ImPulsCore-1.0.0.jar
      - name: Assemble checksums
        run: |
          mkdir -p release
          cp dist/ImPulsCore_Datapack_v1.0.0.zip release/
          cp plugin/target/ImPulsCore-1.0.0.jar release/
          (cd release && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ImPuls-v1.0.0
          path: release/
