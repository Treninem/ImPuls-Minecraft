name: ImPuls build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Restore recovered v0.9.0 archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          names = ['part01', 'part02', 'part31', 'part32']
          text = ''.join(Path(f'archives/ImPulsCore_Datapack_v0.9.0.full.{name}.b64').read_text().strip() for name in names)
          raw = base64.b64decode(text)
          expected = '1329b8c2181b688eda67a688b7a0a96714769173ac682633363645eeb78f27ae'
          actual = hashlib.sha256(raw).hexdigest()
          assert actual == expected, f'v0.9.0 checksum mismatch: {actual}'
          Path('archives/ImPulsCore_Datapack_v0.9.0.zip').write_bytes(raw)
          print(f'restored={len(raw)} sha256={actual}')
          PY
      - name: Build datapack from recovered v0.9.0
        run: python3 tools/build_datapack.py
      - name: Validate release datapack
        run: python3 tools/validate_release.py
      - name: Package datapack as v1.3.0
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, tempfile, zipfile
          src = Path('dist/ImPulsCore_Datapack_v1.0.0.zip')
          dst = Path('dist/ImPulsCore_Datapack_v1.3.0.zip')
          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              with zipfile.ZipFile(src) as z:
                  z.extractall(root)
              mcmeta = root / 'pack.mcmeta'
              data = json.loads(mcmeta.read_text(encoding='utf-8'))
              data['pack']['description'] = 'ImPulsCore v1.3.0 — wall, 32 gates, waves, RPG progression, capital and realms'
              mcmeta.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              with zipfile.ZipFile(dst, 'w', zipfile.ZIP_DEFLATED) as z:
                  for p in sorted(root.rglob('*')):
                      if p.is_file(): z.write(p, p.relative_to(root))
          with zipfile.ZipFile(dst) as z:
              assert z.testzip() is None
              assert 'pack.mcmeta' in z.namelist()
          PY
      - name: Build ImPulsCore plugin
        run: mvn -B -f plugin/pom.xml clean package
      - name: Verify v1.3 JAR and gameplay services
        run: |
          JAR=plugin/target/ImPulsCore-1.3.0.jar
          test -s "$JAR"
          for CLASS in ImPulsCoreV11Plugin ProgressionQuestService TransportService CapitalExpansionService CityProtectionService CityNpcService WorldBossService ItemLifecycleService MarketService ArenaMinigameService RealmExpansionService ProfessionEconomyService GuildExpansionService; do
            jar tf "$JAR" | grep -q "ru/impuls/core/${CLASS}.class"
          done
          unzip -p "$JAR" plugin.yml | grep -q "version: '1.3.0'"
          for FLAG in progression city-protection market duels realm-expansion professions guild-expansion; do
            unzip -p "$JAR" config.yml | grep -q "${FLAG}: true"
          done
      - name: Assemble checksums
        run: |
          mkdir -p release
          cp dist/ImPulsCore_Datapack_v1.3.0.zip release/
          cp plugin/target/ImPulsCore-1.3.0.jar release/
          (cd release && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ImPuls-v1.3.0
          path: release/
